# Revisión automática (CI) de PECDMX.
# Corre en cada push a main y en cada pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura: el robot no puede modificar el repositorio.
permissions:
  contents: read

jobs:
  # Revisa qué carpetas cambiaron, para correr solo las revisiones que hacen falta.
  # Si cambia la CI misma (.github/), o no hay con qué comparar, se revisa todo por si acaso.
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.revisar.outputs.backend }}
      web: ${{ steps.revisar.outputs.web }}
      chatbot: ${{ steps.revisar.outputs.chatbot }}
    steps:
      - name: Descargar el código con su historial
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Comparar contra la versión anterior
        id: revisar
        env:
          # En un PR se compara contra main; en un push a main, contra el commit anterior.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No hay con qué comparar: se revisa todo."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "chatbot=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          archivos=$(git diff --name-only "$BASE" HEAD)
          echo "Archivos que cambiaron:"
          echo "$archivos"

          todo=false
          if echo "$archivos" | grep -q '^\.github/'; then todo=true; fi

          backend=$todo
          web=$todo
          chatbot=$todo
          if echo "$archivos" | grep -q '^backend/'; then backend=true; fi
          if echo "$archivos" | grep -q '^web/'; then web=true; fi
          if echo "$archivos" | grep -q '^chatbot/'; then chatbot=true; fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "chatbot=$chatbot" >> "$GITHUB_OUTPUT"
          echo "Revisar backend: $backend | Revisar web: $web | Revisar chatbot: $chatbot"

  # Revisa que la estructura del proyecto esté sana y que no se haya subido ningún secreto.
  # Siempre corre: es rápida y protege contra subir un .env por accidente.
  estructura:
    name: Estructura y secretos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Verificar que no se subió ningún archivo .env
        run: |
          encontrados=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$' || true)
          if [ -n "$encontrados" ]; then
            echo "::error::Se subieron archivos con secretos. Bórralos del repo y revisa el .gitignore:"
            echo "$encontrados"
            exit 1
          fi
          echo "OK: no hay archivos .env en el repositorio."

      - name: Verificar carpetas del monorepo
        run: |
          for carpeta in backend chatbot web docs; do
            if [ ! -d "$carpeta" ]; then
              echo "::error::Falta la carpeta $carpeta/"
              exit 1
            fi
          done
          echo "OK: están las carpetas backend, chatbot, web y docs."

  # Compila el negocio en Java y corre sus tests (Testcontainers usa el Docker de GitHub).
  backend:
    name: Backend (Java)
    needs: cambios
    if: needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compilar y correr los tests
        run: ./mvnw -B -ntp verify

  # Construye la misma imagen que usará Render. Si un cambio rompe el Dockerfile, se sabe aquí y no al publicar.
  imagen-backend:
    name: Imagen de Docker (backend)
    needs: cambios
    if: needs.cambios.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Construir la imagen
        run: docker build -t pecdmx-backend backend/

  # La página web: tests, linter y que se pueda construir la versión final.
  web:
    name: Web (React)
    needs: cambios
    if: needs.cambios.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # "npm ci" instala exactamente las versiones de package-lock.json (más estricto que "npm install").
      - name: Instalar librerías
        run: npm ci --no-fund --no-audit

      - name: Tests
        run: npm test

      - name: Linter
        run: npm run lint

      - name: Construir la página
        run: npm run build

  # El chatbot en Python: tests, linter, formato y la imagen de Docker que usará Render.
  chatbot:
    name: Chatbot (Python)
    needs: cambios
    if: needs.cambios.outputs.chatbot == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chatbot
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: chatbot/uv.lock

      # --locked: falla si uv.lock no corresponde a pyproject.toml (como "npm ci").
      - name: Instalar Python 3.12 y las librerías
        run: uv sync --locked

      # El modelo de embeddings (135 MB) se guarda en caché: solo se descarga de nuevo si cambia
      # el script de descarga (que tiene la versión y las huellas).
      - name: Recuperar el modelo de embeddings de la caché
        uses: actions/cache@v4
        with:
          path: chatbot/modelos
          key: modelo-e5-${{ hashFiles('chatbot/scripts/descargar_modelo.py') }}

      # Si vino de la caché, el script solo comprueba las huellas y no descarga nada.
      - name: Descargar el modelo y verificar sus huellas
        run: uv run python scripts/descargar_modelo.py

      - name: Tests
        run: uv run pytest

      - name: Linter
        run: uv run ruff check

      - name: Formato
        run: uv run ruff format --check

      - name: Construir la imagen
        run: docker build -t pecdmx-chatbot .

      # El "examen final" con el LLM real (scripts/evaluar.py). Usa los secretos del repo
      # (Settings → Secrets and variables → Actions). Sin ellos, se salta con un aviso.
      - name: Evaluación con el LLM real
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::No hay secretos GROQ_API_KEY ni GEMINI_API_KEY: se salta la evaluación."
            exit 0
          fi
          uv run python scripts/evaluar.py

  # "Semáforo final": GitHub exige solo este check para aceptar cambios en main.
  # Cada job nuevo se agrega a la lista "needs" y así no hay que tocar la regla de GitHub.
  # Un job "saltado" (porque su carpeta no cambió) cuenta como bien; uno que falló o se canceló, no.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [cambios, estructura, backend, imagen-backend, web, chatbot]
    if: always()
    steps:
      - name: Revisar que todos los jobs pasaron
        run: |
          echo "Resultados: ${{ join(needs.*.result, ', ') }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Al menos una revisión falló."
            exit 1
          fi
          echo "Todas las revisiones necesarias pasaron."
