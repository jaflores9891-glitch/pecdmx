spring.application.name=backend

# Las consultas a la base de datos solo ocurren dentro de los servicios,
# nunca "a escondidas" mientras se arma la respuesta HTTP.
spring.jpa.open-in-view=false

# Flyway es el único que crea o cambia tablas. Hibernate solo revisa al arrancar
# que las entidades coincidan con las tablas; si no coinciden, el servicio no arranca.
spring.jpa.hibernate.ddl-auto=validate

# En tu laptop, lee las variables de un archivo .env (ignorado por git) en la raíz del repo o en backend/.
# En Render, las variables se configuran en el panel del servicio y no hay archivo .env.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Primer gerente: se crea al arrancar solo si no hay usuarios. Los valores NUNCA van aquí.
pecdmx.gerente-inicial.correo=${PECDMX_GERENTE_CORREO:}
pecdmx.gerente-inicial.nombre=${PECDMX_GERENTE_NOMBRE:}
pecdmx.gerente-inicial.contrasena=${PECDMX_GERENTE_CONTRASENA:}
